name: Deploy preview to GitHub Pages

on:
  push:
    branches: [claude/website-redesign-advanced-3rqjqu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Sanity studio route is a CMS admin UI and isn't part of the
      # public site; it can't be statically exported, so drop it from the
      # preview build only (the source branch keeps it).
      - name: Exclude CMS studio from static preview
        run: rm -rf app/studio

      - name: Build static site
        run: pnpm build
        env:
          STATIC_EXPORT: "true"
          BASE_PATH: /open-react-template

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
